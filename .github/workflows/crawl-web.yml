name: crawl-web
on:
  schedule: [{cron: "30 */6 * * *"}]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: crawl-web
  cancel-in-progress: false
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests playwright && playwright install --with-deps chromium
      - run: python crawler/browser_crawl.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERT_KEYWORDS: ${{ vars.ALERT_KEYWORDS }}
      - run: |
          git config user.name "jobwatch-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/jobs_web.json
          git diff --cached --quiet || (git commit -m "update web jobs" && git pull --rebase && git push)
